name: photo-to-part
version: "0.1.23"
description: >-
  Skill id photo-to-part:photo-to-printable-part. Pass that exact string
  only to skill_view. Do not pass it to skills_list, and do not add a
  plugin: prefix or a slash. Turn photos, a few
  measurements, or a messy scan into a parametric printable part and check
  the mesh locally. Tools read and write only the paths you pass (STL, 3MF,
  PNG, JSON). No credentials and no printer connection. Enabling the plugin
  installs its Python packages from PyPI after Hermes dependency consent.
  A STEP solid needs CadQuery or build123d in the project environment; that
  install downloads packages and can take several minutes. Chat photos still
  go to your model provider. Install this plugin/ directory.
  A user-stated millimetre value is not replaced by a photo measurement.
  Hermes --yolo auto-approves a build prompt; this plugin does not block that flag.
  Hermes Desktop 0.23 or newer can show an optional Part studio pane while a
  run is in progress. The six tools still install and run when that pane is unavailable.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/hermes-photo-to-part
tags:
  - cad
  - 3d-printing
  - stl
  - skills
manifest_version: 2
api_version: 1
provides_tools:
  - photo_part_validate
  - photo_part_render
  - photo_part_heal
  - photo_part_template
  - photo_part_measure
  - photo_part_build
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - on_session_end
provides_middleware: []
requires_env: []
# Kept in step with pyproject.toml beside this file. That file is what
# Hermes installs for dependencies. This directory is the plugin.
# Install it with `hermes plugins install mojomast/hermes-photo-to-part/plugin`
# so Hermes sparse-checks out only this directory. evals/ and tests/ stay
# at the repository root and are not in that checkout. The stub plugin.yaml
# at the repository root refuses a root install (requires_hermes >=999).
python_dependencies:
  - "trimesh>=4.6.0,<5.3"
  - "manifold3d>=3.2,<3.6"
  - "fast-simplification>=0.1.8,<0.3"
  - "shapely>=2.0.1,<2.3"
  - "mapbox-earcut>=1.0.3,<2.2"
  - "numpy>=1.26,<2.6"
  - "networkx>=3.2,<4"
  - "matplotlib>=3.8,<3.12"
  - "pillow>=10.4,<14"
  - "rtree>=1.3,<1.5"
  - "opencv-python-headless>=4.9,<4.12"
