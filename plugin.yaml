# This file is not the plugin. It exists so `hermes plugins install`
# mojomast/hermes-photo-to-part (no /plugin suffix) refuses before Hermes
# publishes the clone. A root install would copy evals/ and tests/.
# Install the plugin directory instead:
#   hermes plugins install mojomast/hermes-photo-to-part/plugin
#
# Hermes v0.21.7 checks requires_hermes, then manifest_version, inside
# pm.plugin_declarations.manifest_version_error, and that check runs before
# publish. >=999 fails on current Hermes. manifest_version 99 fails even
# when the running version string cannot be parsed (that path is permissive
# for requires_hermes). A future Hermes that both parses as >=999 and
# supports manifest_version 99 would install this root and would ship evals.
name: photo-to-part-repo-root
version: "0.1.16"
manifest_version: 99
requires_hermes: ">=999.0.0"
description: >-
  Refuses a repository-root install so evals/ and tests/ are not published.
  The plugin is the plugin/ directory.
author: mojomast
license: MIT
