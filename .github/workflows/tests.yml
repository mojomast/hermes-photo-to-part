name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip uv
      # Three-day release quarantine, matching the Hermes dependency guidance.
      # 2026-10-30 is three days before the 2026-11-02 research date.
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python --exclude-newer 2026-10-30 -e ".[dev]"
      - run: .venv/bin/python -m unittest discover -s tests -v
